name: Refresh contribution statistics

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_contribution_stats.py
      - .github/workflows/contribution-stats.yml

permissions:
  contents: write

concurrency:
  group: contribution-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate card from public GitHub activity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_contribution_stats.py
      - name: Commit updated statistics
        run: |
          git add assets/github-contributions.svg assets/contribution-stats.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh public contribution statistics'
          git pull --rebase origin main
          git push origin HEAD:main
